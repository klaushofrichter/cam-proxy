name: PR checks

on:
  pull_request:
    branches: [main, production]

# Least privilege for the PR checks; the codeql job asks for more itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      # cam-sim, the simulated camera the tests run against, builds its
      # test-pattern media with ffmpeg; its RTSP needs MediaMTX.
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Install MediaMTX (cam-sim RTSP) and go2rtc
        run: |
          echo "CAMSIM_MEDIAMTX=$(scripts/install-mediamtx.sh "$RUNNER_TEMP/mediamtx")" >> "$GITHUB_ENV"
          echo "CAMPROXY_TEST_GO2RTC=$(scripts/install-go2rtc.sh "$RUNNER_TEMP/go2rtc")" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - run: npm run lint:types
      # Blocking at high for all dependencies, dev included (repository baseline).
      # No allowlist: there are no open high findings. If one cannot be fixed
      # by an update or an override, allowlist it by advisory id here, with a
      # comment and a step that fails once the advisory is gone or fixed.
      - run: npm audit --audit-level=high
      # No camera footage or other media is committed.
      - name: No media files in the repository
        run: |
          if git ls-files | grep -Ei '\.(mp4|flv|jpe?g|png|h26[45]|aac|mov|mkv|pack)$'; then
            echo "::error::media files are not allowed in this repository"; exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - name: Ensure ffmpeg (cam-sim fixtures)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Install MediaMTX (cam-sim RTSP) and go2rtc
        run: |
          echo "CAMSIM_MEDIAMTX=$(scripts/install-mediamtx.sh "$RUNNER_TEMP/mediamtx")" >> "$GITHUB_ENV"
          echo "CAMPROXY_TEST_GO2RTC=$(scripts/install-go2rtc.sh "$RUNNER_TEMP/go2rtc")" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run check
      - run: google-chrome --version
      # The admin UI against a proxy and a cam-sim (e2e/start.ts). No artifact uploads.
      - run: npm run test:e2e
        env:
          CI: 'true'
      # Three cam-sims behind one proxy (e2e/multi/start.ts): the camera picker.
      - run: npm run test:e2e:multi
        env:
          CI: 'true'

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the image and checks it as the cluster runs it (uid 1000,
      # mounted config, fresh /data, go2rtc and ffmpeg present).
      - run: scripts/container-smoke.sh

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never
      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          accepted=.github/codeql-accepted.tsv
          blocking=0
          for f in sarif-results/*.sarif; do
            while IFS=$'\t' read -r rule uri line message; do
              [ -n "$rule" ] || continue
              if grep -v '^#' "$accepted" | awk -F'\t' -v r="$rule" -v p="$uri" '$1==r && $2==p {found=1} END {exit !found}'; then
                echo "::notice::CodeQL $rule at $uri:$line — accepted exception, see $accepted"
              else
                echo "::error::CodeQL $rule — $message"
                echo "    at $uri:$line"
                blocking=$((blocking + 1))
              fi
            done < <(jq -r '.runs[].results[]
              | select((.suppressions // []) | length == 0)
              | [.ruleId,
                 .locations[0].physicalLocation.artifactLocation.uri,
                 (.locations[0].physicalLocation.region.startLine | tostring),
                 .message.text] | @tsv' "$f")
          done
          echo "CodeQL blocking findings: $blocking"
          [ "$blocking" -eq 0 ] || { echo "::error::CodeQL found $blocking unaccepted finding(s)"; exit 1; }
