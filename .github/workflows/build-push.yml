name: Build and publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # No token left in .git for install scripts to find (packages: write).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Install MediaMTX (cam-sim RTSP) and go2rtc
        run: |
          echo "CAMSIM_MEDIAMTX=$(scripts/install-mediamtx.sh "$RUNNER_TEMP/mediamtx")" >> "$GITHUB_ENV"
          echo "CAMPROXY_TEST_GO2RTC=$(scripts/install-go2rtc.sh "$RUNNER_TEMP/go2rtc")" >> "$GITHUB_ENV"
      - run: |
          npm ci
          npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build timestamp
        id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # amd64 for the cluster, arm64 for the Raspberry Pi and the Mac.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=main
            BUILD_DATE=${{ steps.built.outputs.at }}
          # :main and :sha only; release.yml is the sole writer of :v<version> and :latest.
          tags: |
            ghcr.io/klaushofrichter/cam-proxy:main
            ghcr.io/klaushofrichter/cam-proxy:sha-${{ github.sha }}
