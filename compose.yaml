# cam-proxy on the Raspberry Pi, next to the real camera (spec §2).
# Setup: docs/raspberry-pi.md. Next to this file: .env (the CAMPROXY_* secrets,
# mode 600) and data/config.json ("server": { "dataDir": "/data" }); data/ is
# owned by uid 1000, the container's user. Update: docker compose pull && docker compose up -d
# Host networking: the camera connects to the FTP server (2121 and the passive
# ports), and go2rtc stays on 127.0.0.1.
services:
  cam-proxy:
    image: ghcr.io/klaushofrichter/cam-proxy:latest
    restart: unless-stopped
    # Time to end an encode and store a Vision call in flight (up to 10 s) on stop.
    stop_grace_period: 20s
    network_mode: host
    environment:
      CAMPROXY_CONFIG: /data/config.json
      CAMPROXY_TARGET: pi
      CAMPROXY_TOKENS: ${CAMPROXY_TOKENS:?set in .env}
      CAMPROXY_ADMIN_TOKEN: ${CAMPROXY_ADMIN_TOKEN:?set in .env}
      CAMPROXY_CAMERA_PASSWORD: ${CAMPROXY_CAMERA_PASSWORD:?set in .env}
      CAMPROXY_FTP_PASSWORD: ${CAMPROXY_FTP_PASSWORD:-}
      CAMPROXY_GOOGLE_VISION_KEY: ${CAMPROXY_GOOGLE_VISION_KEY:-}
      # Optional: read-only access to GET /control/audit (docs/audit-log.md).
      CAMPROXY_AUDIT_TOKEN: ${CAMPROXY_AUDIT_TOKEN:-}
    volumes:
      - ${CAMPROXY_DATA:-./data}:/data
