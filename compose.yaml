# cam-proxy on the Raspberry Pi, next to the real camera (spec §2).
# Setup: docs/raspberry-pi.md. Next to this file:
#   config/.env       the Pi's one settings file (uid 1000, mode 600, in config/
#                     with mode 700): the CAMPROXY_* secrets, CAMERA_HOST,
#                     PI_ADDRESS, and cams' variables when cams runs here too
#   data/config.json  ("server": { "dataDir": "/data" }); data/ owned by uid 1000
# The container runs as uid 1000. Update: docker compose pull && docker compose up -d
#
# Nothing in this file is substituted from the environment (no ${...}): the
# container can write config/.env ("Use this address"), and nothing it writes
# may change how compose starts it (no image, volume or user from that file).
#
# Host networking: the camera connects to the FTP server (2121 and the passive
# ports), go2rtc stays on 127.0.0.1, and Find camera's ONVIF probe (multicast
# 239.255.255.250:3702) reaches the LAN.
services:
  cam-proxy:
    image: ghcr.io/klaushofrichter/cam-proxy:latest
    restart: unless-stopped
    # Time to end an encode and store a Vision call in flight (up to 10 s) on stop.
    stop_grace_period: 20s
    network_mode: host
    # Every variable in config/.env becomes the container's environment: the
    # secrets (CAMPROXY_TOKENS, CAMPROXY_ADMIN_TOKEN, CAMPROXY_CAMERA_PASSWORD,
    # CAMPROXY_FTP_PASSWORD, optional CAMPROXY_GOOGLE_VISION_KEY,
    # CAMPROXY_AUDIT_TOKEN, CAMPROXY_POE_SWITCH_PASSWORD), CAMERA_HOST
    # (camera.host) and PI_ADDRESS (ftp.publicHost, server.publicUrl).
    env_file: config/.env
    environment:
      CAMPROXY_CONFIG: /data/config.json
      CAMPROXY_TARGET: pi
      # "Use this address" (Settings → Find camera) writes CAMERA_HOST here,
      # and cam-proxy reads CAMERA_HOST and PI_ADDRESS from it at every start.
      CAMPROXY_ENV_FILE: /config/.env
    volumes:
      - ./data:/data
      # The config directory, not the file: a rename can't replace a file
      # mounted on its own, and the backups (.env.bak-<time>, the last 5) go
      # next to it. Only .env, its temp file and its backups are written.
      - ./config:/config
