openapi: 3.1.0
info:
  title: cam-proxy
  version: 0.0.0
  description: >
    The gateway next to a Reolink camera. Timestamps are unix milliseconds.
    Every route except /health needs `Authorization: Bearer <token>`; a token in
    the URL answers 400 `{"error":"token_in_url"}`.
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
security:
  - bearer: []
paths:
  /health:
    get:
      summary: The process is up (no camera check, no auth)
      security: []
      responses:
        '200': { description: '{ ok: true, version, startedAt } (the real running version: the release version, dev locally; startedAt: when this process started serving, unix ms)' }
  /tls/ca.pem:
    get:
      summary: The site CA's certificate, public (spec 2026-10-05-multi-camera-host-design §10.1.4)
      description: >
        PEM (application/x-pem-file) of this host's name-constrained site CA, for cams
        (which accepts it only if its SHA-256 matches its pin) and for browsers. Never a key;
        nothing else is served under /tls/.
      security: []
      responses:
        '200': { description: the CA certificate (PEM) }
        '404': { description: "{ error: no_site_ca } (tls.site is not set)" }
  /api/local/health:
    get:
      summary: The health summary, local only (loopback callers, no key)
      description: >
        For the e-paper display on the Pi (spec 2026-10-03-health-summary-design).
        Answered only when the TCP socket's remote address is 127.0.0.1, ::1 or
        ::ffff:127.0.0.1; X-Forwarded-For and server.trustProxy are never used.
        Any other caller gets what an unknown /api route gets (401 without a
        token, 404 with one). The schema is in
        docs/superpowers/plans/2026-10-03-health-summary.md ("The API schema").
        No secrets. Cache-Control: no-store.
      security: []
      responses:
        '200': { description: '{ schema: 1, generatedAt, version, startedAt, ok, problemCount, thresholds: {diskPercent, tempC, ftpStalledHours}, platform: {pi, model, hostStats}, items: [{id (camera, stream, events, ftp, storage, disk, cpuTemp, underVoltage, inventory, version), label, value, text, problem}], camera: {id, name (the camera-reported name since the camera-name change; the configured camera.name until the camera was read), address, online, since, model, firmware, clockOffsetMs, error, reboot, poeSwitch: {model, port} or null}, stream: {enabled, up, lastFrameAt}, events: {onvif, source, since, resubscribes}, ftp: {enabled, listening, cameraUpload, checkedAt, lastClipAt, clipsStored, failures, stalled, eventsWithoutClip}, proxy: {sseClients, storagePaused, lastRetentionRun, recordingsCache: {bytes, files, capBytes}, lastInventory: {kind, op, outcome, startedAt, message} or null}, disk: {sizeBytes, freeBytes, usedBytes, usedPercent} or null, host: {cpuTempC, underVoltage, memory: {totalBytes, availableBytes, usedPercent}, uptimeS, load: {m1, m5, m15}} or null }' }
        '401': { description: not a loopback caller and no token (as an unknown route) }
        '404': { description: not a loopback caller, with a token (as an unknown route) }
  /api/cameras:
    get:
      summary: The camera and its state
      responses:
        '200': { description: '[{ id, name, online, lastEventTs (the newest live (non-recovered) event''s start, or null), stream: { up, lastFrameTs } | null, publicUrl, address }] (address: the camera''s camera.host as it runs, host and optional port, for clients that reach the camera directly; name: the camera''s own name as read from it, the configured camera.name until the camera was first read; stream is null when stills are off; publicUrl is server.publicUrl or null). Every configured camera in config order; each item also has error (the camera worker''s or its last check''s error, null when fine) and features (string[], the same on every item: what this proxy supports beyond the pre-multi-camera API, e.g. sse-cam-list for /api/stream?cam=a,b; clients test for a name) and latestStill ({ts, url, tileUrl} of the newest still in memory, or null: GET /api/cameras/{cam}/stills/latest.jpg)' }
        '401': { description: missing or wrong token }
  /api/cameras/{cam}:
    get:
      summary: One camera and its state (the entry of GET /api/cameras)
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ id, name, online, lastEventTs, stream, publicUrl, address, error, features, latestStill }, as in GET /api/cameras' }
        '401': { description: missing or wrong token }
        '404': { description: unknown camera }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/extent:
    get:
      summary: How far back the proxy has content (for a timeline's left edge)
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ clips, stills, previews }: the oldest clip start, still minute and preview minute kept (unix ms), each null when none' }
        '404': { description: unknown camera }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/stills:
    get:
      summary: Timestamps that have a still, in a range of at most one day
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: integer } }
        - { name: to, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: '[ts, …] (unix ms), oldest first' }
        '400': { description: 'missing range, to before from, or more than a day' }
        '404': { description: unknown camera, or stills are off }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/stills/latest.jpg:
    get:
      summary: The camera's newest still, from memory (spec 2026-10-05-multi-camera-host-design §6.4; image rate limit)
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string }, description: 'the ETag of the still you have: 304 while it is still the newest' }
      responses:
        '200': { description: 'image/jpeg; ETag "<cam>-<ts>", X-Still-Ts <unix ms>, Cache-Control no-cache' }
        '304': { description: the still of If-None-Match is still the newest (no body) }
        '404': { description: 'unknown camera; or no_still while the stream is down or before the first still: {error: no_still, ts: the last still''s time or null} (never a 304 then)' }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/previews/latest.jpg:
    get:
      summary: The newest still's tile (previews.tileSize), from memory; as stills/latest.jpg
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200': { description: 'image/jpeg; ETag "<cam>-<ts>", X-Still-Ts, Cache-Control no-cache' }
        '304': { description: not changed (no body) }
        '404': { description: 'unknown camera, or {error: no_still, ts}' }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/stills/latest:
    get:
      summary: Every camera's newest still at once (an overview grid; image rate limit)
      responses:
        '200': { description: '[{cam, ts (unix ms or null), url, tileUrl, up (the stream delivers stills)}] in config order' }
  /api/cameras/{cam}/stills/{file}:
    get:
      summary: One still, as <ts>.jpg
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string }, description: '<unix ms>.jpg' }
      responses:
        '200': { description: 'image/jpeg; immutable once its minute is complete' }
        '400': { description: not <unix ms>.jpg }
        '404': { description: no still at that time }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/previews:
    get:
      summary: Preview sprite sheets (one per minute) in a range of at most one day
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: integer } }
        - { name: to, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: '[{ minute, cols, rows, tileW, tileH, intervalS, present: [bool], url }]' }
        '400': { description: 'missing range, to before from, or more than a day' }
        '404': { description: unknown camera, or stills are off }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/previews/{file}:
    get:
      summary: One minute's sprite sheet, as <minute>.jpg
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string }, description: '<minute unix ms>.jpg' }
      responses:
        '200': { description: 'image/jpeg: a cols × rows grid of tiles, missing tiles dark' }
        '400': { description: 'not <minute unix ms>.jpg' }
        '404': { description: 'no sprite for that minute, unknown camera, stills off, or a timestamp that is not a minute boundary' }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/compositions:
    post:
      summary: 'Compose a clip with a pre-/post-roll, anchored at a clip (clipId) or at a second (at, #179); other clips, stills or "No recording" cards fill each second; H.264 10 fps, at most 300 s (120 s at 1080p). 10 a minute per client (dry runs not counted)'
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [preS, postS, size, badge], properties: { clipId: { type: integer, description: 'the anchor clip; exactly one of clipId and at' }, at: { type: integer, description: 'unix ms, a whole second: the window is [at - preS, at + 1 s + postS]; not in the future, not older than the stills and clips kept; the window must have ended' }, span: { type: object, required: [start, end], properties: { start: { type: integer }, end: { type: integer } }, description: 'with clipId only. unix ms: the recording the rolls apply to (cams: the SD-card file); must overlap the clip by at least 1 s; the clip itself when left out' }, preS: { type: integer, minimum: -3600, maximum: 3600, description: '0…3600 with at' }, postS: { type: integer, minimum: -3600, maximum: 3600, description: '0…3600 with at' }, size: { type: string, enum: [sd, 360p, 720p, 1080p] }, badge: { type: boolean }, timeZone: { type: string, description: 'IANA zone for the cards'' time, e.g. America/Chicago; default the process zone' }, dryRun: { type: boolean, description: 'plan only: 200 with what the clip would be made of, no job' } } }
      responses:
        '200': { description: 'dryRun: { start, end, durationS, seconds: { clip, still, card }, clips: [{ start, end }] }' }
        '201': { description: '{ id, state, progress, durationS }' }
        '400': { description: 'invalid input or limits: one anchor, at a whole second in the past and within retention, the window ended, at least 1 s of the span must remain, at most 300 s (120 s at 1080p), detail e.g. "at most 300 s (5:00)"' }
        '404': { description: unknown camera or clip }
        '409': { description: 'nothing_to_compose: no clip or still covers any second of the window' }
        '429': { description: 'busy (one encoding runs and 3 wait), or rate_limited' }
        '503': { description: storage_paused, or no_font (no font for the badge or cards); camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/compositions/{file}:
    get:
      summary: '{id}: the job (state, progress, durationS, error); {id}.mp4: the result once done (409 before)'
      responses:
        '200': { description: the job, or the MP4 }
        '404': { description: unknown job (or another camera's) }
        '409': { description: not_ready }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/compositions/{id}:
    delete:
      summary: Cancel a job and delete its result
      responses:
        '204': { description: cancelled and deleted }
        '404': { description: unknown job }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/clips:
    get:
      summary: Clips that overlap a time range (at most 31 days), oldest first
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: integer }, description: unix ms }
        - { name: to, in: query, required: true, schema: { type: integer }, description: unix ms }
      responses:
        '200': { description: '[{id, start, end, stream, size, origin (ftp: uploaded by the camera; camera: fetched from its SD card by an inventory repair), events: [event ids], url, snapshotUrl (null without a snapshot)}]' }
        '400': { description: 'from/to missing, reversed, or more than 31 days apart' }
        '404': { description: unknown camera }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/clips/{file}:
    get:
      summary: A clip as <id>.mp4 (HTTP Range), or its snapshot as <id>.jpg
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string }, description: '<id>.mp4 or <id>.jpg' }
        - { name: Range, in: header, schema: { type: string }, description: 'e.g. bytes=0-1023, bytes=1024-' }
      responses:
        '200': { description: 'video/mp4 or image/jpeg; Accept-Ranges: bytes; cached as immutable' }
        '206': { description: the requested range, with Content-Range }
        '400': { description: not <id>.mp4 or <id>.jpg }
        '404': { description: 'unknown clip, or no snapshot' }
        '416': { description: 'range not satisfiable (Content-Range: bytes */size)' }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/recordings:
    get:
      summary: "The camera's SD-card recordings of a time range (from/to, at most 48 hours) or of one camera-local day (date), by start. Either includes a recording that starts on the day before and runs past midnight into it"
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: integer }, description: 'unix ms; with to, unless date is given' }
        - { name: to, in: query, schema: { type: integer }, description: 'unix ms; with from, unless date is given' }
        - { name: date, in: query, schema: { type: string }, description: 'YYYY-MM-DD (years 2000 to 2099), a camera-local day: its recordings and the one from the day before that runs past midnight into it. Not with from/to' }
        - { name: stream, in: query, required: true, schema: { type: string, enum: [sub, main] } }
      responses:
        '200': { description: '[{id (the camera file name), start, end (unix ms), stream, size (bytes), kinds (person, vehicle, pet, motion), clipId (the FTP copy: same stream, start within 5 s; or null)}], the same shape for from/to and date; from/to lists the recordings that overlap the range; recordings still being written are left out' }
        '400': { description: '{error: invalid, detail}: neither from/to nor date, date together with from or to, date not a YYYY-MM-DD date, from/to reversed or more than 48 hours apart, or stream not sub/main' }
        '404': { description: unknown camera }
        '502': { description: '{error: recordings_unavailable, reason: search_failed, detail}' }
        '503': { description: "{error: camera_offline}; or {error: recordings_unavailable, reason: busy, detail} with Retry-After: 5 when more camera Searches are waiting than the proxy queues (one runs, 8 wait); camera_restarting (Retry-After) while the camera restarts" }
  /api/cameras/{cam}/recordings/days:
    get:
      summary: The days of a camera-local month that have recordings (the camera's month Search, kept 5 minutes)
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: string }, description: YYYY-MM }
      responses:
        '200': { description: '{ month, days: [day of month] }' }
        '400': { description: not YYYY-MM }
        '404': { description: unknown camera }
        '502': { description: '{error: recordings_unavailable, reason: search_failed, detail}' }
        '503': { description: "{error: camera_offline}; or {error: recordings_unavailable, reason: busy, detail} with Retry-After: 5 when more camera Searches are waiting than the proxy queues (one runs, 8 wait); camera_restarting (Retry-After) while the camera restarts" }
  /api/cameras/{cam}/recordings/{id}:
    get:
      summary: A recording as MP4 (HTTP Range; HEAD too). Fetched from the camera over Baichuan on the first request and streamed while it arrives; later and Range requests come from the cache
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string }, description: 'the file name from the list, e.g. RecS0A_DST20261001_211129_211207_0_5514C080000000_108CE9.mp4' }
        - { name: Range, in: header, schema: { type: string }, description: 'e.g. bytes=0-1023' }
      responses:
        '200': { description: 'video/mp4; Content-Length, Accept-Ranges: bytes; cached as immutable; ETag from the id and size (stable; If-None-Match, If-Range), no Last-Modified. Several ranges in one Range header, and a Range request for a file the cache cannot keep (disk paused, larger than recordings.cacheMB, no room beside the files being read), get the whole file. Range: bytes=0- on a file not yet cached gets the whole file as 200, streamed while it arrives. A failure after the headers ends the body short' }
        '206': { description: the requested range, with Content-Range }
        '304': { description: If-None-Match matched the ETag }
        '400': { description: '{error: invalid, detail}: not a recording id' }
        '404': { description: '{error: unknown_recording} (or not_found: unknown camera)' }
        '416': { description: 'range not satisfiable (Content-Range: bytes */size); answered without a download when the file is not cached' }
        '502': { description: '{error: recordings_unavailable, reason (refused, auth, timeout, protocol, offline: the connection was lost during the transfer, search_failed), detail}' }
        '503': { description: "{error: camera_offline}: the status poller says offline, or no connection to the camera could be made; or {error: recordings_unavailable, reason: busy, detail} with Retry-After: 5 when the camera Search that finds the file can't be queued (one runs, 8 wait); camera_restarting (Retry-After) while the camera restarts" }
  /api/cameras/{cam}/events:
    get:
      summary: Events, newest first
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: integer }, description: start at or after (ms) }
        - { name: to, in: query, schema: { type: integer }, description: start at or before (ms) }
        - { name: kind, in: query, schema: { type: string }, description: 'motion, person, vehicle, pet, …' }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000 } }
      responses:
        '200': { description: '[{ id, kind, source (onvif, poll, or recovered: added from the SD recordings by the events repair, never sent over SSE), start, end, endReason (state, timeout, restart, recovered), analysis: null | {provider, status, reason, stillTs, objects: [{name, score, box: {x0, y0, x1, y1}}], summary: [{category, subtype, score, box}]} }]' }
        '400': { description: invalid parameter }
        '404': { description: unknown camera }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/events/{id}/analysis:
    get:
      summary: The external analysis of an event, with the provider's raw answer
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: '{ eventId, provider, status, reason, stillTs, requestedAt, tookMs, objects, summary: [{category, subtype, score, box}], raw }' }
        '404': { description: 'unknown camera, or no analysis for the event' }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/events/{id}/analysis.jpg:
    get:
      summary: The still that was analysed
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'image/jpeg; cached as immutable' }
        '404': { description: 'unknown camera, no analysis, or no image' }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/analyses:
    get:
      summary: A day of analyses, oldest first (at most 1000), in the stream message's shape
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: integer }, description: event start at or after (ms) }
        - { name: to, in: query, required: true, schema: { type: integer }, description: event start at or before (ms); at most one day after from }
      responses:
        '200': { description: 'the analyses of events starting in [from, to], oldest first, at most 1000: [{ eventId, kind, start, end, provider, status, reason, stillTs, summary: [{category, subtype, score, box}] }]' }
        '400': { description: 'from or to missing, to before from, or more than one day' }
        '401': { description: not signed in }
        '404': { description: unknown camera }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/still-checks:
    post:
      summary: Check a second with Vision (a still check, cams #179); stored apart from events
      description: >
        `at` is a still's time (unix ms): a whole second, not in the future,
        not older than the stills kept (retention.stillsDays, from the start
        of that UTC day). A stored check of that second, or a successful
        automatic analysis that used its still, answers without a call. Then,
        in order: Vision off, no key or checksPerDay 0 (409); no still at
        `at` (404); another check running (429 busy; the same second waits
        for the running call); paused (503); the monthly limit, the daily cap
        (shared with the automatic analyses) and checksPerDay (429 limit).
        One call, 10 s, no retry. Client token or admin; a session needs
        X-CamProxy-UI. At most 20 valid requests a minute per client. Every
        request past the input check is audited (still-check).
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [at], properties: { at: { type: integer, description: 'unix ms, a multiple of 1000' } } }
      responses:
        '201': { description: '{ reused: false, check: { id, stillTs, provider, summary: [{category, subtype, score, box}], objects: [{mid, name, score, box}], events: [{id, kind, confirmed}] (the events the second sits in, computed on read; confirmed: person/vehicle/pet found by the check; motion never), imageUrl (or null when the copy failed), requestedAt, tookMs } }' }
        '200': { description: '{ reused: true, source: check | event, check }: the stored answer, no call. source event: from the automatic analysis of that still (check.id null, check.eventId, imageUrl the analysis image)' }
        '400': { description: '{error: invalid, detail}: at missing, not a whole number, not a whole second, in the future, or older than the stills kept' }
        '401': { description: not signed in (the audit token too) }
        '403': { description: '{error: csrf}: a session without X-CamProxy-UI' }
        '404': { description: '{error: no_still}: no still at at; {error: not_found}: unknown camera' }
        '409': { description: '{error: analytics_off, reason: off | no_key | checks_off}' }
        '429': { description: '{error: limit, reason: month | day | checks}, {error: busy} (another check is running), or {error: rate_limited}' }
        '500': { description: '{error: internal}: the paid result could not be stored' }
        '502': { description: '{error: provider_failed, reason (timeout, network, http_5xx, http_<n>, bad_response, bad_key (pauses analytics), quota (pauses 1 h), aborted (stopping))}: the call counted, nothing stored' }
        '503': { description: '{error: analytics_paused, reason: bad_key | quota, until (ms, or null for bad_key)}; camera_restarting (Retry-After) while the camera restarts' }
    get:
      summary: Still checks of a range, oldest first (at most 1000)
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: integer }, description: the second at or after (ms) }
        - { name: to, in: query, required: true, schema: { type: integer }, description: the second at or before (ms); at most 31 days after from }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        '200': { description: '[{ id, stillTs, provider, summary, events: [{id, kind, confirmed}], imageUrl }]' }
        '400': { description: 'from or to missing, to before from, more than 31 days, or a bad limit' }
        '401': { description: not signed in }
        '404': { description: unknown camera }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/still-checks/{file}:
    get:
      summary: One still check (<id>, with the raw answer) or its JPEG (<id>.jpg)
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string, pattern: '^\d{1,12}(\.jpg)?$' } }
      responses:
        '200': { description: '<id>: { id, stillTs, provider, summary, objects, events, imageUrl, requestedAt, tookMs, raw }; <id>.jpg: image/jpeg, cached as immutable (kept retention.eventsDays with the check)' }
        '400': { description: '{error: invalid}: neither <id> nor <id>.jpg' }
        '404': { description: 'unknown camera or check, or no image' }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/analytics:
    get:
      summary: The Vision budget for clients (no key, no mask)
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ enabled (on, a key, not stopping), paused: null | {reason, until}, month: {calls, limit}, today: {calls, cap (0: no cap)}, checks: {today, cap (0: checks off)} }; calls count automatic analyses and checks' }
        '401': { description: not signed in }
        '404': { description: unknown camera }
        '503': { description: camera_restarting (Retry-After) while the camera restarts }
  /api/cameras/{cam}/archive:
    post:
      summary: Keep a clip in the Archive (apart from retention; docs/archive.md)
      description: >
        source is {type: composition, id} (a finished composition of this camera),
        {type: clip, clipId} (the proxy's FTP copy) or {type: recording, id} (the
        SD card's file, fetched over Baichuan unless cached). Optional name (1-120
        characters, no control characters; default "<YYYY-MM-DD HH:MM:SS> <camera
        name>" of the recording's start, camera time), labels (at most 16 words of
        letters and digits, case-insensitive; Pet, Person, Vehicle, SD, 4K keep
        their spelling), retentionDays (1-36500, null = forever; default 365),
        thumbnailAt (a still second). Starts an archive job and waits up to 3 s.
        Client token or admin; a session needs X-CamProxy-UI; X-On-Behalf-Of (the
        person, from cams) goes into the audit record. At most 10 a minute per
        client. Audited (archive-add) past the input check.
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: X-On-Behalf-Of, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [source], properties: { source: { type: object }, name: { type: string }, labels: { type: array, items: { type: string } }, retentionDays: { type: [integer, 'null'] }, thumbnailAt: { type: integer } } }
      responses:
        '201': { description: 'the archive job, done: { id, cam, state: done, phase: null, progress: 1, bytes, size, archiveId, item }' }
        '202': { description: 'the archive job, still running: { id, cam, state, phase (fetching | copying | finishing), progress, bytes, size }; poll /api/archive/jobs/{job}' }
        '400': { description: '{error: invalid, detail}' }
        '401': { description: not signed in }
        '403': { description: '{error: csrf}' }
        '404': { description: '{error: not_found} (camera, composition, clip) or {error: unknown_recording}' }
        '409': { description: '{error: not_ready, state}: the composition is not done' }
        '429': { description: '{error: rate_limited} or {error: busy} (4 archive jobs in flight)' }
        '503': { description: '{error: archive_off} (archive.enabled false) or {error: camera_offline}; camera_restarting (Retry-After) while the camera restarts' }
        '507': { description: '{error: insufficient_space, needed, free, minFreeBytes}: the clip would not leave storage.minFreeBytes free' }
  /api/archive:
    get:
      summary: The Archive's clips (this proxy's), with filters, sorting and paging
      parameters:
        - { name: cam, in: query, schema: { type: string } }
        - { name: labels, in: query, schema: { type: string }, description: comma-separated; clips with all of them (case-insensitive) }
        - { name: q, in: query, schema: { type: string }, description: text in the name }
        - { name: from, in: query, schema: { type: integer }, description: recordedFrom at or after (ms) }
        - { name: to, in: query, schema: { type: integer }, description: recordedFrom at or before (ms) }
        - { name: quality, in: query, schema: { type: string }, description: 'comma-separated: sd, 360p, 720p, 1080p, 4k' }
        - { name: sort, in: query, schema: { type: string, enum: [created, recorded, name, size, expires, cam, quality, duration, labels] } }
        - { name: order, in: query, schema: { type: string, enum: [desc, asc] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: '{ total, offset, limit, items: [ArchiveItem] } (docs/archive.md §1)' }
        '400': { description: '{error: invalid, detail}' }
        '401': { description: not signed in }
  /api/archive/status:
    get:
      summary: The Archive's figures (the Status card)
      responses:
        '200': { description: '{ enabled, count, bytes, forever, oldestCreatedAt, newestCreatedAt, disk: {free, size}, percentOfDisk, warnPercent, warning, minFreeBytes, nextCleanupAt, expiringAtNextCleanup, lastCleanup, labels: [{label, count}] }' }
        '401': { description: not signed in }
  /api/archive/zip:
    get:
      summary: Several clips as one ZIP, streamed (stored entries, ZIP64 when needed)
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string }, description: 'comma-separated archive ids, at most 200' }
      responses:
        '200': { description: 'application/zip with Content-Length: per clip "<name> (<id>).mp4", ".json" (the metadata), ".jpg" (the thumbnail, when there is one). At most 4 a minute per client' }
        '400': { description: '{error: invalid}' }
        '401': { description: not signed in }
        '404': { description: '{error: not_found, missing: [ids]}' }
        '429': { description: '{error: rate_limited}' }
  /api/archive/jobs/{job}:
    get:
      summary: An archive job (kept 15 minutes after it ended)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ id, cam, state (queued | running | done | failed | cancelled), phase, progress, bytes, size, archiveId?, item?, error?, detail? }; error: insufficient_space, camera_offline, unknown_recording, fetch_failed, source_gone, store_failed, cancelled' }
        '401': { description: not signed in }
        '404': { description: unknown job }
    delete:
      summary: Cancel an archive job
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: cancelled (or forgotten, when it had ended) }
        '401': { description: not signed in }
        '404': { description: unknown job }
  /api/archive/delete:
    post:
      summary: Delete several clips (one archive-delete record each)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 500 } } }
      responses:
        '200': { description: '{ deleted: [ids], notFound: [ids] }' }
        '400': { description: '{error: invalid}' }
        '401': { description: not signed in }
  /api/archive/{id}:
    get:
      summary: One clip (ArchiveItem)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ArchiveItem }
        '400': { description: not a whole number }
        '401': { description: not signed in }
        '404': { description: unknown id }
    patch:
      summary: Change a clip's name, labels or retention (archive-update when something changed)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, labels: { type: array, items: { type: string } }, retentionDays: { type: [integer, 'null'] } } }
      responses:
        '200': { description: ArchiveItem }
        '400': { description: '{error: invalid, detail}' }
        '401': { description: not signed in }
        '404': { description: unknown id }
    delete:
      summary: Delete a clip (archive-delete)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: deleted }
        '400': { description: not a whole number }
        '401': { description: not signed in }
        '404': { description: unknown id }
  /api/archive/{id}/video:
    get:
      summary: The clip (video/mp4), with Range requests; ?download=1 for an attachment named after the clip
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: download, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: video/mp4, immutable }
        '206': { description: a range }
        '401': { description: not signed in }
        '404': { description: unknown id or no file }
        '416': { description: the range is past the end }
  /api/archive/{id}/thumbnail:
    get:
      summary: The clip's thumbnail (image/jpeg)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: image/jpeg, immutable }
        '401': { description: not signed in }
        '404': { description: unknown id, or no thumbnail (thumbnail.from none) }
  /api/archive/{id}/metadata:
    get:
      summary: 'The clip''s metadata: { schema: 1, item, camera, window, events (with analyses), stillChecks, proxy, archivedAt }'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: ArchiveMetadata (docs/archive.md §4) }
        '401': { description: not signed in }
        '404': { description: unknown id }
  /api/stream:
    get:
      summary: Server-Sent Events, resumable
      description: >
        Replays everything after `Last-Event-ID` (or `?since`), then continues
        live. A resume point older than the retention answers `event: reset`
        with `{oldestId}` first. Types: camera-event
        `{cam, eventId, kind, phase: start|end, ts, source}` (an `end` may
        carry `reason: timeout|restart`); camera-status
        `{cam, online, reason, clockOffsetMs}` (plus `stream: up|down` when
        the stills stream changes); clip
        `{cam, clipId, start, end, stream, size, codec, events (live event
        ids; never a recovered one), url, snapshotUrl}`; analysis (an event's analysis was stored)
        `{eventId, kind, start, end, provider, status, reason, stillTs,
        summary, objects}` (`analysis` messages stored before this version
        lack kind, start, end, stillTs and summary: a missing `summary` means
        unknown, not "nothing found"); camera `{cam, name, address}` (once per change
        of the camera's name: a rename through PUT /control/camera/name or one
        made in the Reolink app, seen by the status poll; and once per change
        of the camera's address, camera.host as it runs, when the camera side
        starts with another one: then `name` is the name last told, left out
        while none was told yet; messages stored before this version have no
        `address`); still-check (a new
        still check, cams #179) `{cam, id, stillTs, provider, summary, objects,
        events: [{id, kind, confirmed}], imageUrl, requestedAt, tookMs}`; archive (a change
        to the Archive, docs/archive.md §7) `{cam, action (add, update, delete, clear,
        expire), ids, items (add and update: ArchiveItem)}`; annotation
        (reserved, not sent yet); still
        `{cam, ts, url, sprite, tile}` (only when named in `types`; live
        only, without an id, and not replayed).
      parameters:
        - { name: cam, in: query, schema: { type: string }, description: 'one camera id, or several comma-separated (a,b; when the camera items list features sse-cam-list); empties are ignored, an unknown id matches nothing' }
        - { name: types, in: query, schema: { type: string }, description: comma list }
        - { name: kinds, in: query, schema: { type: string }, description: comma list, matches data.kind }
        - { name: since, in: query, schema: { type: integer } }
      responses:
        '200': { description: text/event-stream }
        '400': { description: '{ error: invalid, detail: "unknown type: X" }' }
        '503': { description: '{ error: too_many_clients }' }
  /metrics:
    get:
      summary: Prometheus metrics (no auth; counts only)
      security: []
      responses:
        '200': { description: text/plain; version=0.0.4 }
  /control/login:
    post:
      summary: Admin UI sign-in with the admin token; sets the session cookie
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '204': { description: signed in (camproxy_session cookie, HttpOnly, SameSite=Strict, 12 h) }
        '401': { description: wrong token }
        '429': { description: too many attempts (40 per 15 minutes) }
  /control/login-links:
    post:
      summary: A one-time sign-in link for the admin UI (cams mints it for a signed-in user; admin token only)
      responses:
        '201': { description: '{ code, expiresInS: 60 }: redeem once at /control/login-link?code= within the time' }
        '401': { description: no token }
        '403': { description: not the admin token }
  /control/login-link:
    get:
      summary: Redeems a one-time code for a UI session, then redirects to the UI
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: 'to / with the session cookie; to /?link=expired when the code is used, unknown or expired, or after 200 attempts in 15 minutes' }
  /control/logout:
    post:
      summary: Clears the session cookie
      security: []
      responses:
        '204': { description: signed out }
  /control/session:
    get:
      summary: Whether the request carries a valid session cookie
      security: []
      responses:
        '200': { description: '{ loggedIn: boolean }' }
  /control/status:
    get:
      summary: Camera, event intake, SSE clients, retention (admin)
      description: >
        Admin token or admin session. Writes with the session cookie need
        `X-CamProxy-UI: 1`. A client token answers 403 `{"error":"admin_only"}`.
      responses:
        '200': { description: '{ version, camera (incl. name (the camera''s name; the configured camera.name until the camera was read), nameSource (camera or config), webUiUrl, reboot {kind, requestedAt, confirmed, phase, offAt, endedAt, downSec} or null, poeSwitch {model, host, port, ports, offSeconds, passwordSet, configured, busy, last}), intake, sse: {clients}, stream: {enabled, up, go2rtcUp, lastFrameTs}, retention, storage: {paused}, ftp: {enabled, listening, port, tls, publicHost, passwordSet, lastUpload, lastClip, clips, failures, camera: {state (on, off, elsewhere, server_differs, not_set_up, unknown), checkedAt, enable, server, port, user, mismatch, error} or null, stalled: {stalled, hours, lastClip, events} or null}, recordings: {last: {at, result (ok, offline, refused, auth, timeout, protocol, not_found), stream, bytes, ms, priority (high: a viewer, low: an inventory repair)} or null, cache: {bytes, files, capBytes} (the host's one cache, every camera), camera: {bytes, files} (this camera's part)}, analytics: [provider state], analyticsUnmapped: top 20 unmapped objects [{mid, name, count, lastSeen}], health: the health summary, as GET /api/local/health, archive: as GET /api/archive/status, cameras: every camera''s block {id, camera, intake, stream, ftp, recordings} in config order (the top-level camera, intake, stream, ftp and recordings are the first camera''s) }' }
        '401': { description: not signed in }
        '403': { description: admin_only, or csrf }
  /control/cameras:
    get:
      summary: Every camera's status block, in config order (spec 2026-10-05-multi-camera-host-design §6.3) (admin)
      responses:
        '200': { description: 'A list of {id, camera, intake, stream, ftp, recordings, source (config: config.json; added: added in the Settings page)}, each as in GET /control/status' }
        '401': { description: not signed in }
        '403': { description: admin_only }
  /control/cameras/{cam}/status:
    get:
      summary: One camera's status block (admin)
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{id, camera, intake, stream, ftp, recordings}' }
        '401': { description: not signed in }
        '404': { description: not_found }
        '503': { description: camera_restarting (Retry-After) }
  /control/cameras/{cam}/actions/{name}:
    post:
      summary: A camera action on one camera (spec 2026-10-05-multi-camera-host-design §6.3) (admin)
      description: >
        The camera actions of POST /control/actions/{name} (camera-test,
        onvif-resubscribe, camera-ftp-setup, camera-ftp-test, camera-ftp-off,
        restart (that camera's side only; the old route without a camera restarts every camera side and applies pending restart settings), camera-reboot,
        camera-powercycle, camera-poe-on, poe-switch-read, inventory,
        inventory-repair, inventory-cancel, camera-cert-push, camera-ntp-set, camera-trust-clear) on the named camera, with the same
        bodies and answers; inventory-cancel and inventory-repair answer 409
        camera_mismatch for another camera's run. The old route takes ?cam=<id> as well; without it
        it acts on the only camera, and answers 400 camera_required when there
        are several. Host actions have no camera route (404).
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: as POST /control/actions/{name} }
        '202': { description: as POST /control/actions/{name} }
        '401': { description: not signed in }
        '404': { description: not_found (unknown camera, or not a camera action) }
        '503': { description: camera_restarting (Retry-After) }
  /control/cameras/{cam}/name:
    put:
      summary: Rename one camera (stored on the camera), as PUT /control/camera/name (admin)
      parameters:
        - { name: cam, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ name } as read back' }
        '400': { description: invalid_name }
        '401': { description: not signed in }
        '404': { description: not_found }
        '503': { description: camera_restarting (Retry-After), or camera_offline }
  /control/camera/name:
    put:
      summary: Renames the camera, on the camera (admin)
      description: >
        Checks the camera's rules (1 to 31 characters; ASCII letters, digits,
        space and - ( ) + = [ ] { }; no leading or trailing space), writes
        SetDevName {DevName: {name}}, reads GetDevName back and answers that
        name. The camera stores the name; the configured camera.name is only
        the fallback until it was read. Admin token, or an admin session with
        `X-CamProxy-UI: 1`. Audited as camera-name. Stream clients get a
        `camera` message.
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, pattern: '^[A-Za-z0-9()+=\[\]{}-](?:[A-Za-z0-9 ()+=\[\]{}-]{0,29}[A-Za-z0-9()+=\[\]{}-])?$' } } }
      responses:
        '200': { description: '{ name }: the name read back from the camera' }
        '400': { description: '{ error: invalid_name, reason }: against the rules (the camera is not asked), or refused by the camera (rspCode -54, -56); { error: camera_required } on a proxy with several cameras (use /control/cameras/{cam}/name or ?cam=)' }
        '401': { description: not signed in }
        '403': { description: admin_only, or csrf }
        '502': { description: '{ error: camera_error } (or camera_auth_failed)' }
        '503': { description: '{ error: camera_offline }' }
  /control/analytics:
    get:
      summary: External analytics providers - state, usage and limits (admin)
      responses:
        '200': { description: '[{ id, name, enabled, keyMasked (first4…last4, never the key), keySource (env, manual or none), month: {calls, limit}, today: {calls, cap}, paused: null | {reason, until}, lastCall, lastError, checks: {today, cap} (still checks today, checksPerDay) }]' }
        '401': { description: not signed in }
        '403': { description: admin_only }
  /control/analytics/unmapped:
    get:
      summary: Objects seen but not mapped to person, vehicle or pet (admin)
      responses:
        '200': { description: '[{ mid, name, count, lastSeen }], most frequent first' }
        '401': { description: not signed in }
        '403': { description: admin_only }
    delete:
      summary: Clear the unmapped list (admin)
      responses:
        '200': { description: '{ cleared }' }
        '401': { description: not signed in }
        '403': { description: admin_only, or csrf }
  /control/secrets/google-vision-key:
    put:
      summary: Sets or overrides the Google Vision key at runtime, in memory only (admin)
      description: >
        Replaces the key in use at once (from CAMPROXY_GOOGLE_VISION_KEY or an
        earlier manual key) and lifts an invalid-key pause. The key is never
        written to disk, the config or the logs, and never returned; a restart
        of the process restores the configured key, or none. Recorded in the
        audit log as `secret-override` with the masked key. Admin token or
        admin session (with `X-CamProxy-UI: 1`); the client and audit tokens
        answer 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, minLength: 20, maxLength: 200, pattern: '^[\x21-\x7e]+$', description: 'printable ASCII, no spaces' }
      responses:
        '200': { description: '{ keySource: manual, keyMasked: "AIza…wXyZ", replaced: env | manual | none }' }
        '400': { description: '{ error: invalid, detail } (never echoes the key)' }
        '401': { description: not signed in }
        '403': { description: admin_only, or csrf }
  /control/stats:
    get:
      summary: Disk, events, stream log, storage budget (spec §13)
      responses:
        '200': { description: '{ disk: {catalog, stills, previews, clips, recordings} (each {bytes, files, oldest, newest, growthPerDay}), events: {stored (live events per kind, recovered ones left out), byCamera (the same per camera id)}, stream: {rows, lastId}, sse: {clients}, storage: {budget, used, daysUntilFull, paused} }' }
  /control/inventory:
    get:
      summary: The running inventory or repair and the last 10 runs per kind, newest first (spec 2026-10-02-inventory-design)
      responses:
        '200': { description: '{ running: { runId, kind, op: check|repair, startedAt, outcome: running, progress: { phase, done, total, note? } } | null, runs: { stills: [summary], clips: [summary] }, repairs: { clips: [summary] } }; a summary is { runId, kind, startedAt, tookMs, outcome: ok|cancelled|failed, counts, message }' }
  /control/inventory/runs/{id}:
    get:
      summary: One inventory report, or the running view while it runs
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z]{1,16}-\d{1,15}-[0-9a-f]{6}$' } }
      responses:
        '200': { description: '{ runId, kind, op (check|repair), camera, startedAt, tookMs, outcome, error?, cancelledBy? (request|stop), requestedBy, options? ({camera: true}: compared with the camera), source? (a repair: the check run it worked from), stopped? (a repair: why it ended early or left candidates: clip-cap, byte-cap (also when candidates were skipped for the 200 MB), max-gb, paused, failures, refused, camera_offline, event-cap (an events repair: more than 1000 missing), or null), window: { from, to, reason (retention|budget|store-younger|empty|sd-card: the SD card's reach, shorter than the events retention), retentionFrom, protectedFrom, notes (caveats on the counts); clips with the camera and events: camera: { stream, to (judged up to here), oldestSdDay, unknownDays }; events: eventsDays }, counts (clips with the camera: cameraDays, unknownDays, recordings, timerOnly, paired, pairedOtherStream (recordings here as clips of the other stream, never missing), missingLocally, missingLocallyBytes, prunedHere (older than the oldest local clip while the storage budget prunes clips: not offered), goneFromCamera, olderThanSd, otherStream; events: eventsDays, cameraDays, unknownDays, recordings, timerOnly, spans, matched, missingEvents, missingPerson, missingVehicle, missingPet, missingMotion, events, eventsWithoutRecording; a repair: candidates, requested, done, failed, skipped, bytes; an events repair: checked (missing in the check), candidates (missing now), requested, done, skipped (an event of the kind by then), failed, donePerson, doneVehicle, donePet, doneMotion), top (stills: the 10 longest gaps; clips: the camera days with the most missing; events: the camera days with the most missing spans {date, state, spans, missing}; a repair: up to 10 failures), items (up to 500: stills file problems; clips missing-locally first, then gone-from-camera, row-without-file, file-without-row, snapshot-without-clip, event-without-clip, clip-without-event; events: missing-event {kind, start, end, date, recordings} oldest first, then event-without-recording {eventId, kind, start, end, source}; an events repair: one per event added {eventId, kind, start, end, result: ok}; a clips repair: one per recording tried, {id, start, result: ok|skipped|failed, reason? (skipped: outside-retention, already-local, gone-from-camera, other-stream, viewer, invalid, too-big, byte-cap, busy, still-recording), error?, clipId?, bytes?, streamed? (went through a temp file under inventory/tmp)}), itemsTruncated, message }' }
        '400': { description: not a run id }
        '404': { description: unknown run }
  /control/tls:
    get:
      summary: The site CA, the proxy's certificate and every camera's (the Certificates card) (admin)
      responses:
        '200': { description: '{ site (or null), caFingerprint ("SHA256:" + upper-case hex of the CA DER; the pin cams takes), caNotAfter, proxy: { servername, fingerprint, notAfter } or null, cameras: [{ id, mode (site-ca, pinned, public, none), servername, fingerprint, notAfter, lastPush: { at, outcome (pushed, current, refused, failed) } or null, problem }], problems: [text] }; without tls.site: site null, cameras [], problems []' }
        '401': { description: not signed in }
  /control/admin:
    get:
      summary: The cams-admin card (docs/cams-admin.md); never any key material (admin)
      responses:
        '200': { description: '{ state (off, disabled, not-enrolled, key-unsafe, key-invalid, connecting, connected, backoff, rejected, incompatible), url, account, proxyId, fingerprint ("SHA256:" + upper-case hex of the proxy key), enrolledAt, connectedSince, lastHeartbeatAt, lastAckAt, lastError, lastErrorAt, retryInMs, truncated, lingering }' }
        '401': { description: not signed in }
  /control/admin/enroll:
    post:
      summary: Enroll with cams-admin with a one-time code ({url, code}); the key file, camsAdmin.url, connects at once; audited (admin-enroll), never the code
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [url, code], properties: { url: { type: string }, code: { type: string } } }
      responses:
        '200': { description: the card's view (as GET /control/admin) }
        '400': { description: '{ error, message }: bad_url, not_a_code, invalid_code (unknown, used, cancelled or expired), bad_proof, bad_request, unsupported_version, too_large' }
        '429': { description: '{ error: rate_limited, message, retryAfterS }' }
        '502': { description: '{ error: unreachable | server_error | bad_answer, message }' }
  /control/admin/reconnect:
    post:
      summary: Closes the cams-admin connection and connects again now
      responses:
        '200': { description: the card's view }
        '409': { description: '{ error: not_connecting, state }: no client (not enrolled, off, key problem)' }
  /control/admin/unenroll:
    post:
      summary: bye unenrolled (cams-admin revokes the key), the key file deleted, the camsAdmin.url override cleared; audited (admin-unenroll)
      responses:
        '200': { description: the card's view }
  /control/config:
    get:
      summary: Every setting with value, source, restart flag and pending next value
      responses:
        '200': { description: '{ "<path>": { value, source (default, file, override, env), env? (the variable that sets it: CAMERA_HOST, PI_ADDRESS or their CAMPROXY_ names), restart, restartScope? (camera: a cameras.<id>.* setting, applied by that camera's restart or the host-wide one; host: applied by the host-wide restart, POST /control/actions/restart without a camera), pending, next?, type (integer, boolean or string), resetTo? (an override: what removing it goes back to, { value?, source: file or default }) } }' }
    put:
      summary: Sets overrides (stored in overrides.json); live settings apply at once
      requestBody:
        content:
          application/json:
            schema: { type: object, description: 'a partial config.json, e.g. {"sse":{"pingS":10}}; {"cameras":{"<new id>":{"host":…}}} adds a camera (it starts at once, without a restart)' }
      responses:
        '200': { description: the new view (as GET) }
        '400': { description: '{ error: invalid, detail: "<path>: <why>" } (also "<path>: set in .env (<VARIABLE>)" for a setting the environment sets)' }
    delete:
      summary: Removes every override at once (the Settings page's "Reset to defaults"), back to the file or default values; one config-change audit record (reset all)
      responses:
        '200': { description: the new view (as GET) }
        '400': { description: '{ error: invalid, detail } when the file and default values alone are not a valid configuration' }
  /control/config/{path}:
    delete:
      summary: Removes one override (back to the file or default value)
      parameters:
        - { name: path, in: path, required: true, schema: { type: string }, description: 'e.g. sse.pingS; cameras.<id> removes a camera added here (its worker stops, its files stay until retention removes them)' }
      responses:
        '200': { description: the new view }
        '400': { description: 'unknown setting; cameras.<id> of a config.json camera: "defined in config.json; remove it there"' }
  /control/actions/{name}:
    post:
      summary: onvif-resubscribe, camera-test, retention-run ({dryRun}), camera-ftp-setup, camera-ftp-test, camera-ftp-off, restart (the camera side), camera-reboot, camera-powercycle, camera-poe-on, poe-switch-read, restart-proxy (the process), inventory ({kind, camera?}), inventory-repair ({kind, runId}), inventory-cancel, find-camera, camera-address ({host}), archive-clear ({count}), camera-cert-push, camera-ntp-set, camera-trust-clear, tls-ca-rotate ({confirm: rotate}), tls-ca-drop-previous
      description: |
        camera-trust-clear ({"confirm":"clear"}) drops a camera's site-CA trust or pin (its leaf moved aside, its factory
        certificate forgotten; its next push is an admin's camera-cert-push, which trusts what it serves then): answers the
        camera's certificate state; 400 invalid without the confirm; 409 not_available when no camera trust is kept here; a
        camera-trust audit record. tls-ca-drop-previous ({"confirm":"drop"}) stops trusting the previous CA after a rotation
        now (otherwise 30 days): { dropped: true }; 400 invalid without the confirm, 409 not_available without one; a
        camera-trust audit record. tls-ca-rotate, tls-ca-drop-previous and camera-trust-clear: at most 6 a minute per client
        together (429 rate_limited).
        camera-ntp-set sets the camera's NTP server to ntp.server now (GetNtp, a whole-object SetNtp, GetNtp again;
        the proxy also does it when the camera comes online, at most once an hour): { outcome (set, already,
        unsupported, failed) }; 409 not_configured without ntp.server. A camera-ntp audit record unless already.
        camera-cert-push ("Push now", site CA): issues the camera's leaf if needed and pushes it now (no 04:00 window,
        never during an open event); answers the push result { outcome (pushed, current, refused, failed), served, detail?, tookMs }
        (failed with a detail when nothing was pushed: an open event, an HTTP camera, a tlsName camera, an address outside the CA).
        tls-ca-rotate ({"confirm":"rotate"}) makes a new site CA (the old files kept as *.old-<time>), a new proxy
        certificate, and pushes every camera again; every cams pin of this proxy must change. Answers { caFingerprint };
        400 invalid without the confirm, 409 not_available without tls.site, 409 busy while another rotation runs;
        a config-change audit record.
        camera-reboot reboots the camera (about a minute offline; every camera token becomes invalid).
        camera-powercycle cuts the camera's PoE on its switch (camera.poeSwitch, CAMPROXY_POE_SWITCH_PASSWORD)
        for offSeconds and turns it on again; it answers once PoE is back on. It shares the 120 s cooldown
        with camera-reboot. Once its PoE-off request is sent, any failure turns PoE on again and answers 502
        with poeOff: true and turnedOn. camera-poe-on turns the camera's port on if it is off (recovery; no
        power check, no cooldown). poe-switch-read reads the camera's port on the switch (never polled).
        restart-proxy answers 202, then stops gracefully (as on SIGTERM) and exits 0; a supervisor
        (compose, the cluster) starts it again. Both are admin only (sessions need X-CamProxy-UI) and audited.
        inventory starts an inventory ({"kind":"stills"}, {"kind":"clips"}, {"kind":"clips","camera":true} to
        compare with the camera's SD card, or {"kind":"events"}: the events against the SD recordings) in the
        background; poll GET /control/inventory/runs/{id}.
        inventory-repair ({"kind":"clips","runId":<a clips run with the camera, less than an hour old>}) fetches the
        recordings missing locally over Baichuan (at most 50 or 200 MB per run); {"kind":"events","runId":<an events
        run less than an hour old>} adds the missing events as recovered ones (at most 1000 per run). One run of
        either at a time.
        They write an inventory or inventory-repair audit record when they end, no control-action.
        find-camera sends an ONVIF WS-Discovery Probe (NetworkVideoTransmitter) to 239.255.255.250:3702
        and lists what answers within 3 s (no login; on the Pi the container's host network reaches the LAN);
        at most 6 per minute per client. camera-address ({"host":"<address>[:port]"}) writes CAMERA_HOST into
        the .env file named by CAMPROXY_ENV_FILE (only that line; a backup .env.bak-<UTC time> first, the newest 5 kept; temp
        file + rename) and writes a camera-address audit record; the address applies after restart-proxy.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'camera-test and retention-run results; camera-ftp-setup/-off: {ftp} (the camera''s settings, no password); camera-ftp-test: {ok, rspCode}; poe-switch-read: {at, port, index, poe, watts, link, sn, firmware}; camera-poe-on: the same plus wasOn; inventory-cancel: { cancelled, runId }; find-camera: { devices: [{endpoint, address (XAddr host), sender (UDP source), mismatch, useAddress (sender on a mismatch), xaddrs, name, hardware, model, current}], tookMs, envFile: {writable, path?, reason?} }; camera-address: { host, previous, key, backup, restart: true }; archive-clear: { cleared, bytes }' }
        '202': { description: 'started (onvif-resubscribe, restart, restart-proxy); camera-reboot: { confirmed } (false: the camera dropped the connection after receiving the request); camera-powercycle: { offAt, onAt, watts } once PoE is back on; inventory, inventory-repair: { runId }' }
        '400': { description: 'archive-clear: invalid (no count); camera-address: invalid (not an address or name with an optional :port); inventory: invalid (an unknown or missing kind, camera not a boolean, or camera for a kind without a camera compare); inventory-repair: invalid (a kind without a repair, or runId not a run id); a camera action (camera-test, onvif-resubscribe, camera-ftp-*, restart, camera-reboot, camera-powercycle, camera-poe-on, poe-switch-read, inventory*) on a proxy with several cameras without ?cam=<id>: camera_required (or POST /control/cameras/{cam}/actions/{name})' }
        '404': { description: 'unknown action; inventory-repair: not_found (no such check run of the kind)' }
        '409': { description: 'archive-clear: count_mismatch { count } (count is not the number of clips in the Archive now); camera-address: not_available { detail, line } (CAMPROXY_ENV_FILE not set, the file fails the path guard, or its directory is not writable; line is what to add by hand); not_configured (camera-ftp-setup/-test: ftp.publicHost or the FTP password is not set; camera-powercycle, poe-switch-read: no switch or no CAMPROXY_POE_SWITCH_PASSWORD); camera-powercycle, poe-switch-read: switch_busy (someone is logged in to the switch''s web UI), no_power (the port has PoE off or draws 0 W; nothing switched); inventory, inventory-repair: inventory_busy { runId } (one runs already); inventory-repair: report_stale (the check run is an hour old or more), not_repairable (it did not finish, did not compare with the camera, or found nothing missing locally)' }
        '503': { description: 'stopping (inventory, inventory-repair: the proxy is stopping and starts no run)' }
        '429': { description: 'find-camera, camera-address: rate_limited (more than 6 per minute, together); camera-reboot, camera-powercycle: too_soon, within 120 s of the last reboot or power-cycle, or while one is being sent (Retry-After)' }
        '502': { description: 'the camera refused or failed the call; camera-reboot: the request never reached the camera (camera_offline, camera_auth_failed, camera_error); camera-powercycle, camera-poe-on, poe-switch-read: switch_auth, switch_unreachable, switch_error (camera-powercycle, camera-poe-on: poeOff, turnedOn when PoE may have been cut)' }
  /control/log:
    get:
      summary: Recent log lines (info and above), redacted
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 }, description: 'default 100; the buffer itself holds only the last 500 lines' }
      responses:
        '200': { description: '[{ level, time, msg, … }]' }
  /control/audit:
    get:
      summary: The audit log as ECS JSON lines (admin token, admin session, or CAMPROXY_AUDIT_TOKEN)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: before, in: query, description: "cursor: older records, newest first", schema: { type: string } }
        - { name: after, in: query, description: "cursor: newer records, oldest first (empty: from the oldest)", schema: { type: string } }
        - { name: from, in: query, description: unix ms, schema: { type: integer } }
        - { name: to, in: query, description: unix ms, schema: { type: integer } }
        - { name: action, in: query, description: "event.action values, comma-separated; each one of the known actions (docs/audit-log.md)", schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure, unknown] } }
      responses:
        '200': { description: "application/x-ndjson, one ECS record per line, each with cam_proxy.cursor; headers X-Next-Cursor and X-Has-More" }
        '400': { description: 'bad cursor, range, limit or outcome, or an unknown action ({ error: invalid, detail: "unknown action: <name>" })' }
        '401': { description: no or unknown token }
        '403': { description: a client token, or the audit token on anything but GET /control/audit and /control/audit/summary }
  /control/audit/summary:
    get:
      summary: How long audit records are kept and how many are (admin token, admin session, or CAMPROXY_AUDIT_TOKEN)
      responses:
        '200': { description: '{ retentionDays (retention.auditDays), records (the records in the day files the retention keeps, all actions) }' }
        '401': { description: no or unknown token }
        '403': { description: a client token }
